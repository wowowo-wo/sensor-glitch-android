name: Build and publish Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project archive
        run: |
          cat project.part.00 project.part.01 project.part.02 project.part.03 project.part.04 > project.zip.b64
          base64 -d project.zip.b64 > project.zip
          unzip -t project.zip
          mkdir -p build-src
          unzip -q project.zip -d build-src
          rm project.zip project.zip.b64

          # Chaquopy uses src/main/python by default. Remove the old Kotlin DSL
          # sourceSets/python block independent of line numbers.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-src/app/build.gradle.kts')
          s = p.read_text()
          block = '''    sourceSets {\n        getByName("main") {\n            python.srcDir("src/main/python")\n        }\n    }\n'''
          if block in s:
              s = s.replace(block, '')
          else:
              import re
              s = re.sub(r'\n\s*sourceSets\s*\{\s*getByName\("main"\)\s*\{\s*python\.srcDir\("src/main/python"\)\s*\}\s*\}\s*', '\n', s, flags=re.S)
          p.write_text(s)
          PY

          # Keep dark-mode text readable regardless of device theme.
          cp overrides/themes.xml build-src/app/src/main/res/values/themes.xml

          # Programmatically-created labels also get explicit high-contrast colors.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-src/app/src/main/java/com/example/sensorglitchlocal/MainActivity.kt')
          s = p.read_text()
          if 'import android.graphics.Color' not in s:
              s = s.replace('import android.graphics.BitmapFactory\n', 'import android.graphics.BitmapFactory\nimport android.graphics.Color\n')
          s = s.replace(
              'textSize = 16f\n            setPadding(0, 20, 0, 8)',
              'textSize = 16f\n            setTextColor(Color.rgb(247, 248, 252))\n            setPadding(0, 20, 0, 8)'
          )
          s = s.replace(
              'text = "${spec.label}: ${spec.format(spec.default)}"\n        }',
              'text = "${spec.label}: ${spec.format(spec.default)}"\n            setTextColor(Color.rgb(225, 229, 238))\n            textSize = 14f\n        }'
          )
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: build-src
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp build-src/app/build/outputs/apk/debug/app-debug.apk SensorGlitch.apk
          ls -lh SensorGlitch.apk

      - name: Replace latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest SensorGlitch.apk \
            --target "${GITHUB_SHA}" \
            --title "Sensor Glitch – Latest" \
            --notes "Expanded processing build: regional failure, highlight collapse, smear modes, block corruption, pixel dropout, brutal black crush, optical blur, and expanded presets."

      - name: Add direct download link to job summary
        run: |
          echo "## Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[SensorGlitch.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/SensorGlitch.apk)" >> "$GITHUB_STEP_SUMMARY"
